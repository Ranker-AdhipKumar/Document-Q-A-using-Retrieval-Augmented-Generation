services:
  - type: web
    name: document-qa-system
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_PERSISTED_DOCS
        value: "20"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: EMBEDDING_MODEL
        value: "models/gemini-embedding-2"
